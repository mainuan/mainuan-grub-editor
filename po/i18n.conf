# Configuration for po/i18n.sh (Mainuan i18n maintenance script).
# This repository keeps its historical layout: catalogs live in
# locale/<lang>/LC_MESSAGES/mainuan-grub-editor.po and the POT in locale/.
DOMAIN=mainuan-grub-editor
PACKAGE_NAME="Mainuan GRUB Editor"
POT="$ROOT/locale/mainuan-grub-editor.pot"
PO_NAME="../locale/%s/LC_MESSAGES/mainuan-grub-editor.po"
BUGS_ADDRESS=https://github.com/MainuanLinux/mainuan-grub-editor/issues
